<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI DevOps Log Analyzer</title>
    <style>
        body {
            background-color: #0f172a;
            color: #cbd5e1;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-w: 500px;
            width: 100%;
            border: 1px solid #334155;
            box-sizing: border-box;
        }
        .badge {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 4px 12px;
            border-radius: 9999px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            display: inline-block;
        }
        .text-center { text-align: center; }
        .mb-8 { margin-bottom: 32px; }
        .mt-3 { margin-top: 12px; }
        .mb-2 { margin-bottom: 8px; }
        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            margin: 12px 0 8px 0;
            letter-spacing: -0.025em;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
        }
        .upload-box {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 32px 16px;
            text-align: center;
            background-color: rgba(18, 58, 153, 0.3);
            margin-bottom: 24px;
        }
        .upload-box:hover {
            border-color: #3b82f6;
        }
        input[type="file"] {
            color: #94a3b8;
            font-size: 14px;
        }
        .hint {
            font-size: 12px;
            color: #1b60bb;
            margin-top: 8px;
            margin-bottom: 0;
        }
        button {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        button:hover {
            background-color: #0509f1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-8">
            <span class="badge">DevOps & Security Toolkit</span>
            <h1>AI Network Log Analyzer</h1>
            <p>Upload raw server or network logs to extract critical errors, detect security bottlenecks, and generate structural resolution pathways.</p>
        </div>
        
        <form action="/analyze-log" method="POST" enctype="multipart/form-data">
            <div class="upload-box">
                <input type="file" name="file" id="file" accept=".log,.txt" required>
                <p class="hint">Supports standard server files (.log, .txt)</p>
            </div>
            
            <button type="submit">Execute AI Analysis</button>
        </form>
    </div>
</body>
</html>
