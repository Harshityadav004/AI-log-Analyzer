<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI System Audit Report</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Essential standard styling for the raw dynamic HTML output */
        .prose h1, .prose h2, .prose h3 { color: #ffffff; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .prose h2 { font-size: 1.25rem; border-bottom: 1px solid #334155; padding-bottom: 0.25rem; }
        .prose p { margin-bottom: 1rem; line-height: 1.6; color: #cbd5e1; }
        .prose ul, .prose ol { margin-left: 1.5rem; margin-bottom: 1rem; list-style-type: disc; color: #cbd5e1; }
        .prose li { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Document Title Banner -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">
                    Audit Status: Completed
                </span>
                <h1 class="text-xl font-bold text-white mt-2">Log File: <span class="text-blue-400 font-mono">{{ filename }}</span></h1>
            </div>
            <a href="/" class="text-sm font-medium bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl transition border border-slate-600">
                Upload Another Log
            </a>
        </div>

        <!-- Generated Analysis Report Container -->
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
            <h2 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-6 border-b border-slate-700 pb-2">
                Automated Infrastructure & Security Findings
            </h2>
            <div class="prose max-w-none">
                {{ report_content | safe }}
            </div>
        </div>
        
    </div>
</body>
</html>
